

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal TV — webOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #07080a;
        --rail-bg: #0f1015;
        --bg-elevated: #161922;
        --surface: #1e222f;
        --surface-hover: #272c3d;
        --border: #353c52;
        --text: #ffffff;
        --text-dim: #c5c8d4;
        --text-faint: #81889c;
        --accent: #ffd166;
        --accent-soft: rgba(255, 209, 102, 0.25);
        --danger: #ff6b6b;
        --ok: #6bd68f;
        --rail-w: 5.5rem;
        --safe-x: clamp(24px, 3.5vw, 50px);
        --safe-y: clamp(20px, 3vh, 40px);
    }

    * { box-sizing: border-box; }
    html { font-size: 22px; } 

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        margin: 0;
        height: 100vh;
        height: 100dvh;
        padding-left: var(--rail-w);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    button { font-family: inherit; }

    /* ---------- Barra Lateral (Rail) ---------- */
    .rail {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: var(--rail-w);
        background: var(--rail-bg);
        border-right: 2px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: var(--safe-y) 0;
        z-index: 60;
    }
    .rail-mark {
        width: 2.8rem; height: 2.8rem; border-radius: 10px; background: var(--accent);
        display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; flex: none;
    }
    .rail-mark svg { width: 1.5rem; height: 1.5rem; }

    .rail-btn {
        width: 3.6rem; height: 3.6rem;
        background: transparent; color: var(--text-dim);
        border: 3px solid transparent; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .rail-btn svg { width: 1.7rem; height: 1.7rem; }
    .rail-btn:hover, .rail-btn:focus-visible {
        color: var(--bg); border-color: var(--accent); background: var(--accent);
        box-shadow: 0 0 0 5px var(--accent-soft); outline: none; transform: scale(1.05);
    }
    .rail-btn[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .rail-spacer { flex: 1; }

    /* ---------- Barra de Busca ---------- */
    .search-bar {
        display: none;
        align-items: center;
        gap: 1rem;
        margin: var(--safe-y) var(--safe-x) 0;
        background: var(--surface);
        border: 3px solid var(--border);
        border-radius: 14px;
        padding: 0.4rem 1.2rem;
        flex-shrink: 0;
    }
    .search-bar.open { display: flex; }
    .search-bar svg { width: 1.4rem; height: 1.4rem; color: var(--text-faint); flex: none; }
    .search-bar input {
        flex: 1; background: transparent; border: none; color: var(--text);
        font-size: 1.15rem; padding: 0.8rem 0; font-family: inherit; font-weight: 600;
    }
    .search-bar input:focus { outline: none; }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }

    /* ---------- Cabeçalho da Tela ---------- */
    .view-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--safe-y) var(--safe-x) 1rem;
        flex-shrink: 0;
    }
    .view-title-wrap {
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }
    h1 { 
        font-family: 'Outfit', sans-serif; 
        font-weight: 800; 
        font-size: 1.6rem; 
        margin: 0; 
        letter-spacing: 0.02em; 
        color: #fff;
    }
    
    .back-btn {
        display: none;
        background: var(--surface);
        color: var(--text);
        border: 3px solid var(--border);
        padding: 0.6rem 1.2rem;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .back-btn:hover, .back-btn:focus-visible {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg);
        outline: none;
        box-shadow: 0 0 0 5px var(--accent-soft);
    }

    /* ---------- Grade de Canais ---------- */
    .main-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        gap: 30px;
        flex-grow: 1;
        padding: 0 var(--safe-x) var(--safe-y);
        overflow: hidden;
    }

    .sidebar-panel {
        background: transparent;
        border: 0;
        border-radius: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .panel-scroll {
        flex-grow: 1;
        overflow-y: auto;
        padding: 6px;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
        align-content: start;
        gap: 20px;
        scroll-behavior: smooth;
    }
    .panel-scroll::-webkit-scrollbar { width: 10px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

    .nav-card {
        appearance: none;
        background: #14171e;
        border: 1px solid #282c36;
        padding: 20px 22px;
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        aspect-ratio: 1 / 1;
        min-width: 0;
        text-decoration: none;
        text-align: center;
        width: 100%;
        color: var(--text);
        transition: all 0.2s ease;
    }
    .nav-card .label {
        font-family: 'Outfit', sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        white-space: normal;
        overflow-wrap: anywhere;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0;
    }
    
    .nav-card .badge {
        font-size: 0.85rem;
        background: var(--bg);
        min-width: 32px;
        height: 24px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-weight: 700;
        border: 0;
        flex-shrink: 0;
    }

    .nav-card:hover, .nav-card:focus-visible {
        border-color: var(--accent);
        background: #1c202a;
        color: var(--text);
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .nav-card:hover .badge, .nav-card:focus-visible .badge {
        background: var(--bg);
        color: var(--text);
        border-color: var(--bg);
    }

    .category-section-title {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--accent);
        margin: 14px 0 6px 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .hidden { display: none !important; }

    /* ---------- Empty state ---------- */
    .empty-state {
        grid-column: 1 / -1;
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: 1.2rem; padding: 4rem 1rem; color: var(--text-dim); margin: auto;
    }
    .empty-state h3 { font-family: 'Outfit', sans-serif; color: var(--text); margin: 0; font-size: 1.3rem; }
    .empty-state p { margin: 0; font-size: 1rem; }

    /* ---------- Botões Gerais ---------- */
    .btn {
        background: var(--surface); color: var(--text); border: 3px solid var(--border);
        padding: 0.9rem 1.6rem; font-size: 1.1rem; font-weight: 700; border-radius: 12px; cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn:hover, .btn:focus-visible {
        border-color: var(--accent); background: var(--accent); color: var(--bg); outline: none;
        box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 800; }

    /* ---------- Modal de Configurações ---------- */
    #settings-modal {
        display: none; position: fixed; inset: 0; background: rgba(7, 8, 10, 0.92);
        backdrop-filter: blur(6px); z-index: 100; padding: var(--safe-y) var(--safe-x); overflow-y: auto;
    }
    .settings-content {
        max-width: 50rem; margin: 3vh auto; background: var(--bg-elevated); border: 2px solid var(--border);
        padding: 2.8rem; border-radius: 22px; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    .settings-header { margin-bottom: 2rem; }
    .settings-header h2 { padding: 0; margin-bottom: 0.5rem; font-size: 1.8rem; }
    .settings-header p { margin: 0; color: var(--text-dim); font-size: 1.1rem; }

    .field-label { display: block; font-size: 1rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.6rem; }
    .import-container { display: flex; gap: 0.8rem; }

    input[type="text"] {
        flex-grow: 1; background: var(--surface); color: var(--text); border: 3px solid var(--border);
        padding: 1rem 1.2rem; font-size: 1.1rem; border-radius: 12px; font-family: inherit; font-weight: 600;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.8rem;
        background: var(--surface);
        padding: 1rem 1.2rem;
        border-radius: 12px;
        border: 2px solid var(--border);
        cursor: pointer;
    }
    .checkbox-container input {
        width: 1.5rem;
        height: 1.5rem;
        accent-color: var(--accent);
        cursor: pointer;
    }
    .checkbox-container span {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
    }

    textarea {
        width: 100%; background: var(--surface); color: var(--text); border: 3px solid var(--border);
        margin-top: 1.8rem; padding: 1.2rem; font-size: 1.05rem; border-radius: 12px;
        font-family: monospace; height: 14rem; resize: vertical; line-height: 1.5;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    ::placeholder { color: var(--text-faint); font-size: 1.05rem; }

    #import-msg { margin-top: 0.8rem; font-size: 1rem; min-height: 1.2em; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    #import-msg.ok { color: var(--ok); }
    #import-msg.err { color: var(--danger); }
    .settings-actions { margin-top: 2rem; display: flex; gap: 1rem; }
    .channel-category { display: block; margin-top: 8px; font-size: 0.8rem; font-weight: 500; }
    @media (max-width: 600px) {
        html { font-size: 16px; }
        :root { --rail-w: 4.5rem; --safe-x: 12px; --safe-y: 16px; }
        h1 { font-size: 1.5rem; }
        .view-title-wrap { gap: 12px; flex-wrap: wrap; }
        .panel-scroll { padding: 12px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 130px), 1fr)); }
        .nav-card { padding: 12px; gap: 10px; }
        .nav-card .label { font-size: 1rem; }
        .search-bar input { min-width: 0; width: 100%; }
        .settings-content { padding: 16px; }
        .import-container, .settings-actions { flex-wrap: wrap; }
        .import-container input { min-width: 0; width: 100%; }
    }

    /* ---------- webOS-inspired lightweight skin ---------- */
    :root {
        --bg: #111214;
        --rail-bg: #17181b;
        --bg-elevated: #202124;
        --surface: #25262a;
        --surface-hover: #303136;
        --border: rgba(255,255,255,.10);
        --text: #f5f5f7;
        --text-dim: #c7c7cc;
        --text-faint: #8e8e93;
        --accent: #e91e63;
        --accent-soft: rgba(233,30,99,.22);
        --rail-w: 5rem;
    }
    html { font-size: 21px; }
    body {
        background: radial-gradient(circle at 48% -15%, #2a2b30 0, #151619 38%, #101113 72%);
        font-family: Arial, Helvetica, sans-serif;
    }
    .rail {
        background: rgba(22,23,26,.96);
        border-right: 1px solid rgba(255,255,255,.07);
        gap: .75rem;
    }
    .rail-mark {
        width: 2.65rem; height: 2.65rem;
        border-radius: 50%;
        background: var(--accent);
        margin-bottom: .7rem;
        box-shadow: 0 6px 22px rgba(233,30,99,.20);
    }
    .rail-mark svg { width: 1.35rem; height: 1.35rem; }
    .rail-btn {
        width: 3.35rem; height: 3.35rem;
        border: 0;
        border-radius: 50%;
        color: #b8b8bd;
        transition: transform .12s ease, background .12s ease, color .12s ease;
    }
    .rail-btn:hover, .rail-btn:focus-visible,
    .rail-btn[aria-pressed="true"] {
        color: #fff;
        background: var(--accent);
        border: 0;
        outline: none;
        box-shadow: 0 0 0 4px rgba(255,255,255,.12);
        transform: scale(1.08);
    }
    .view-header { padding-bottom: .8rem; }
    h1 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.55rem;
        font-weight: 600;
        letter-spacing: -.02em;
    }
    .panel-scroll {
        gap: 16px;
        padding: 6px 8px 14px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr));
    }
    .nav-card {
        background: #25262a;
        border: 1px solid rgba(255,255,255,.06);
        border-radius: 18px;
        padding: 20px;
        gap: 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,.16);
        transition: transform .13s ease, background .13s ease, box-shadow .13s ease, border-color .13s ease;
    }
    .nav-card .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.12rem;
        font-weight: 600;
        letter-spacing: -.01em;
    }
    .nav-card .badge {
        background: rgba(255,255,255,.09);
        color: #d6d6da;
        border-radius: 999px;
        min-width: 34px;
        height: 25px;
        padding: 0 9px;
        font-size: .78rem;
        font-weight: 600;
    }
    .nav-card:hover, .nav-card:focus-visible {
        background: #34353a;
        border-color: rgba(255,255,255,.38);
        outline: none;
        box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 0 3px rgba(255,255,255,.13);
        transform: scale(1.035);
    }
    .nav-card:hover .badge, .nav-card:focus-visible .badge {
        background: var(--accent);
        color: #fff;
    }
    .search-bar {
        background: #242529;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        padding: .25rem 1.1rem;
    }
    .search-bar:focus-within {
        border-color: rgba(255,255,255,.48);
        box-shadow: 0 0 0 3px rgba(255,255,255,.10);
    }
    .back-btn, .btn {
        background: #2a2b2f;
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 999px;
        font-weight: 600;
    }
    .back-btn:hover, .back-btn:focus-visible,
    .btn:hover, .btn:focus-visible,
    .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #settings-modal {
        background: rgba(5,5,7,.72);
        backdrop-filter: blur(10px);
    }
    .settings-content {
        background: #202125;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }
    input[type="text"], textarea, .checkbox-container {
        background: #292a2f;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 14px;
    }
    input[type="text"]:focus, textarea:focus {
        border-color: rgba(255,255,255,.48);
        box-shadow: 0 0 0 3px rgba(255,255,255,.10);
    }
    .checkbox-container input { accent-color: var(--accent); }
    .category-section-title { color: #d9d9de; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }


/* LG/webOS launcher layout */
:root{--lg-red:#a50034;--lg-red-bright:#d4003b;--lg-black:#0b0b0d;--lg-charcoal:#17171a;--lg-gray:#26262a;--lg-line:rgba(255,255,255,.12);--accent:var(--lg-red-bright);--accent-soft:rgba(212,0,59,.24);--bg:var(--lg-black);--surface:var(--lg-charcoal);--surface-hover:#242428;--border:var(--lg-line);--rail-w:4.7rem}
body{background:linear-gradient(135deg,#09090b 0%,#151519 55%,#0b0b0d 100%);}
.rail{background:rgba(12,12,14,.96);border-right:1px solid var(--lg-line)}

<script>
    const panelContent = document.getElementById('panel-content');
    const viewTitle = document.getElementById('view-title');
    const btnBack = document.getElementById('btn-back');
    const settingsModal = document.getElementById('settings-modal');
    const inputConfig = document.getElementById('input-config');
    const inputLink = document.getElementById('input-link');
    const chkCategories = document.getElementById('chk-categories');
    const inputSearch = document.getElementById('input-search');
    const searchBar = document.getElementById('search-bar');
    const railSearch = document.getElementById('rail-search');
    const railHome = document.getElementById('rail-home');
    const railSettings = document.getElementById('rail-settings');
    const btnImport = document.getElementById('btn-import');
    const importMsg = document.getElementById('import-msg');


    let parsedData = { template: '', categories: {} };
    let currentView = 'home';
    let activeCategory = null;

    function loadConfig() {
        return localStorage.getItem('portal_configText') || '';
    }

    function loadUseCategories() {
        const val = localStorage.getItem('portal_useCategories');
        return val !== null ? val === 'true' : true;
    }

    function scrollPanel(amount) {
        panelContent.scrollBy({ top: amount, behavior: 'smooth' });
    }

    function parseConfig(configText) {
        const categories = {};
        if (!configText || configText.trim() === '') return { template: '', categories };

        const lines = configText.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) return { template: '', categories };

        const templateLine = lines[0].split(';')[0].split('\t')[0];
        const template = templateLine.replace(/"/g, '').trim();

        for (let i = 1; i < lines.length; i++) {
            let currentLine = lines[i];
            let parts = [];

            if (currentLine.includes('\t')) parts = currentLine.split('\t');
            else if (currentLine.includes(';')) parts = currentLine.split(';');
            else if (currentLine.includes(',')) parts = currentLine.split(',');

            if (parts.length >= 3) {
                const category = parts[0].replace(/"/g, '').trim();
                const name = parts[1].replace(/"/g, '').trim();
                const id = parts[2].replace(/"/g, '').trim();

                if (category && name && id) {
                    if (!categories[category]) categories[category] = [];
                    categories[category].push({ name, id });
                }
            }
        }
        return { template, categories };
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
    }

    function channelCard(url, name, category = '') {
        const safeName = escapeHtml(name);
        const detail = category ? `<small class="channel-category">${escapeHtml(category)}</small>` : '<small class="channel-category">Canal</small>';
        const monogram = escapeHtml(String(name).trim().slice(0, 2).toUpperCase());
        return `<a class="nav-card channel-card" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" aria-label="${safeName} — abrir em nova aba">
                    <span class="channel-monogram">${monogram}</span>
                    <span class="card-content">
                        <span class="card-kicker">Assistir agora</span>
                        <span class="label">${safeName}</span>
                        <span class="card-meta">${detail}<span class="card-arrow">›</span></span>
                    </span>
                </a>`;
    }

    function renderHome() {
        const useCategories = loadUseCategories();
        parsedData = parseConfig(loadConfig());
        const categories = parsedData.categories;

        if (Object.keys(categories).length === 0) {
            currentView = 'home';
            viewTitle.textContent = 'Início';
            if (btnBack) btnBack.style.display = 'none';
            panelContent.innerHTML = `
                <div class="empty-state">
                    <h3>Nenhum canal encontrado</h3>
                    <p>Clique no botão de engrenagem na barra lateral para configurar sua lista.</p>
                    <button class="btn primary" id="btn-empty-settings" style="margin-top:15px;">Configurar Agora</button>
                </div>`;
            const btn = document.getElementById('btn-empty-settings');
            if(btn) btn.addEventListener('click', openModal);
            return;
        }

        if (useCategories) {
            currentView = 'categories-home';
            viewTitle.textContent = 'Categorias';
            if (btnBack) btnBack.style.display = 'none';

            let html = '';
            for (const catName in categories) {
                const count = categories[catName].length;
                html += `<button type="button" class="nav-card category-card" onclick="openCategory('${catName.replace(/'/g, "\'")}')">
                            <span class="badge">${count}</span>
                            <span class="card-content">
                                <span class="card-kicker">Categoria</span>
                                <span class="label">${escapeHtml(catName)}</span>
                                
                            </span>
                         </button>`;
            }
            panelContent.innerHTML = html;
        } else {
            currentView = 'all-channels';
            viewTitle.textContent = 'Canais';
            if (btnBack) btnBack.style.display = 'none';

            let allChannels = [];
            for (const catName in categories) {
                categories[catName].forEach(item => {
                    let link = parsedData.template;
                    if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
                    else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);
                    allChannels.push({ name: item.name, link, category: catName });
                });
            }

            allChannels.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

            let html = '';
            allChannels.forEach(item => {
                html += channelCard(item.link, item.name);
            });
            panelContent.innerHTML = html;
        }

        setTimeout(() => {
            const first = panelContent.querySelector('.nav-card');
            if (first && route.view !== 'search' && !route.settings) first.focus();
        }, 50);
    }

    function renderCategory(catName) {
        currentView = 'category-details';
        activeCategory = catName;
        viewTitle.textContent = catName;
        if (btnBack) btnBack.style.display = 'block';

        const items = parsedData.categories[catName] || [];
        let html = '';
        items.forEach(item => {
            let link = parsedData.template;
            if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
            else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);

            html += channelCard(link, item.name);
        });
        panelContent.innerHTML = html;

        setTimeout(() => {
            const first = panelContent.querySelector('.nav-card');
            if (first && route.view !== 'search' && !route.settings) first.focus();
        }, 50);
    }

    if (btnBack) btnBack.addEventListener('click', goBack);

    /* ---------- Busca ---------- */
    function applySearch() {
        const query = inputSearch.value.trim().toLowerCase();
        if (!query) {
            renderHome();
            return;
        }

        currentView = 'search';
        viewTitle.textContent = 'Busca';
        if (btnBack) btnBack.style.display = 'block';

        let html = '';
        for (const catName in parsedData.categories) {
            parsedData.categories[catName].forEach(item => {
                if (item.name.toLowerCase().includes(query)) {
                    let link = parsedData.template;
                    if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
                    else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);

                    html += channelCard(link, item.name, catName);
                }
            });
        }
        panelContent.innerHTML = html || '<div class="empty-state"><h3>Nenhum canal encontrado com esse nome</h3></div>';
    }
    inputSearch.addEventListener('input', () => {
        route.query = inputSearch.value;
        history.replaceState(route, '');
        applySearch();
        if (btnBack) btnBack.style.display = 'block';
    });

    railSearch.addEventListener('click', () => {
        if (route.view === 'search') goBack();
        else navigate({ view: 'search', query: '' });
    });
    railHome.addEventListener('click', () => {
        if (route.depth > 0) history.go(-route.depth);
    });

    /* ---------- Configurações ---------- */
    function setImportMsg(text, type) {
        importMsg.className = type || '';
        importMsg.textContent = text;
    }

    btnImport.addEventListener('click', async () => {
        const url = inputLink.value.trim();
        if (!url) { setImportMsg('Por favor, digite um link válido.', 'err'); return; }
        setImportMsg('Carregando lista, aguarde...', '');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Erro');
            const text = await response.text();
            inputConfig.value = text;
            setImportMsg('Lista carregada com sucesso!', 'ok');
        } catch (error) {
            try {
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                const responseProxy = await fetch(proxyUrl);
                if (!responseProxy.ok) throw new Error('Erro');
                const text = await responseProxy.text();
                inputConfig.value = text;
                setImportMsg('Lista carregada com sucesso!', 'ok');
            } catch (errProxy) {
                setImportMsg('Não foi possível carregar este link.', 'err');
            }
        }
    });

    function renderModal() {
        inputConfig.value = loadConfig();
        chkCategories.checked = loadUseCategories();
        setImportMsg('', '');
        inputLink.value = '';
        settingsModal.style.display = 'block';
        inputLink.focus();
    }
    function openModal() {
        if (!route.settings) navigate({ ...route, settings: true });
    }
    function closeModal() { goBack(); }
    railSettings.addEventListener('click', openModal);
    document.getElementById('btn-close').addEventListener('click', closeModal);

    document.getElementById('btn-save').addEventListener('click', () => {
        localStorage.setItem('portal_configText', inputConfig.value);
        localStorage.setItem('portal_useCategories', chkCategories.checked);
        goBack();
    });

    // Each screen has a real history entry: mobile Back and TV Back share it.
    let route = { portal: true, view: 'home', depth: 0 };
    let backPending = false;

    function rememberPosition() {
        route.scroll = panelContent.scrollTop;
        const cards = [...panelContent.querySelectorAll('.nav-card')];
        route.focus = cards.indexOf(document.activeElement);
        history.replaceState(route, '');
    }
    function navigate(next) {
        rememberPosition();
        route = { portal: true, ...next, depth: route.depth + 1, scroll: 0, focus: -1 };
        history.pushState(route, '');
        renderRoute();
    }
    function openCategory(category) { navigate({ view: 'category', category }); }
    function goBack() {
        if (route.depth <= 0 || backPending) return;
        backPending = true;
        history.back();
    }
    function renderRoute() {
        settingsModal.style.display = 'none';
        const searching = route.view === 'search';
        searchBar.classList.toggle('open', searching);
        railSearch.setAttribute('aria-pressed', String(searching));
        inputSearch.value = searching ? (route.query || '') : '';
        parsedData = parseConfig(loadConfig());
        if (route.view === 'category') renderCategory(route.category);
        else if (searching) applySearch();
        else renderHome();
        if (btnBack) btnBack.style.display = route.depth > 0 ? 'block' : 'none';
        if (route.settings) renderModal();
        // Runs after the renderers' default focus, preserving position on return.
        setTimeout(() => {
            if (route.settings) inputLink.focus();
            else if (searching) inputSearch.focus();
            else {
                const cards = panelContent.querySelectorAll('.nav-card');
                const target = cards[route.focus] || cards[0] || railSettings;
                target.focus({ preventScroll: true });
            }
            panelContent.scrollTop = route.scroll || 0;
        }, 60);
    }
    window.addEventListener('popstate', event => {
        backPending = false;
        if (!event.state || !event.state.portal) return;
        route = event.state;
        renderRoute();
    });
    document.addEventListener('keydown', event => {
        const editing = event.target.matches('input, textarea, [contenteditable="true"]');
        const isBack = ['BrowserBack', 'GoBack', 'Escape'].includes(event.key)
            || [10009, 461].includes(event.keyCode)
            || ((event.key === 'Backspace' || event.keyCode === 8) && !editing);
        if (isBack && route.depth > 0) {
            event.preventDefault();
            if (!event.repeat) goBack();
            return;
        }
        // Directional navigation keeps the square grid usable with a TV remote.
        if (editing || route.settings || !['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
        const cards = [...panelContent.querySelectorAll('.nav-card')];
        const index = cards.indexOf(document.activeElement);
        if (index < 0) {
            const rail = [railSearch, railHome, railSettings];
            const railIndex = rail.indexOf(document.activeElement);
            if (railIndex < 0) return;
            let target;
            if (event.key === 'ArrowRight') target = cards[0];
            else if (event.key === 'ArrowUp') target = rail[railIndex - 1];
            else if (event.key === 'ArrowDown') target = rail[railIndex + 1];
            if (target) { event.preventDefault(); target.focus(); }
            return;
        }
        const columns = getComputedStyle(panelContent).gridTemplateColumns.split(' ').length;
        const delta = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns, ArrowDown: columns }[event.key];
        const target = cards[index + delta];
        event.preventDefault();
        if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
        else if (event.key === 'ArrowLeft') railHome.focus();
    });

    // Fluxo em janelas separadas: Categorias -> Canais -> Voltar.
    // Mantém a identidade visual LG/webOS e usa o histórico/foco já implementados acima.

    window.onload = () => {
        if (history.state && history.state.portal) route = history.state;
        else history.replaceState(route, '');
        renderRoute();
    };
</script>
</body>
</html>
