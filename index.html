<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Smart TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #07080a;
        --rail-bg: #0f1015;
        --bg-elevated: #161922;
        --surface: #1e222f;
        --surface-hover: #272c3d;
        --border: #353c52;
        --text: #ffffff;
        --text-dim: #c5c8d4;
        --text-faint: #81889c;
        --accent: #ffd166;
        --accent-soft: rgba(255, 209, 102, 0.25);
        --danger: #ff6b6b;
        --ok: #6bd68f;
        --rail-w: 5.5rem;
        --safe-x: clamp(24px, 3.5vw, 50px);
        --safe-y: clamp(20px, 3vh, 40px);
    }

    * { box-sizing: border-box; }
    html { font-size: 22px; } 

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        margin: 0;
        height: 100vh;
        padding-left: var(--rail-w);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    button { font-family: inherit; }

    /* ---------- Barra Lateral (Rail) ---------- */
    .rail {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: var(--rail-w);
        background: var(--rail-bg);
        border-right: 2px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: var(--safe-y) 0;
        z-index: 60;
    }
    .rail-mark {
        width: 2.8rem; height: 2.8rem; border-radius: 10px; background: var(--accent);
        display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; flex: none;
    }
    .rail-mark svg { width: 1.5rem; height: 1.5rem; }

    .rail-btn {
        width: 3.6rem; height: 3.6rem;
        background: transparent; color: var(--text-dim);
        border: 3px solid transparent; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .rail-btn svg { width: 1.7rem; height: 1.7rem; }
    .rail-btn:hover, .rail-btn:focus-visible {
        color: var(--bg); border-color: var(--accent); background: var(--accent);
        box-shadow: 0 0 0 5px var(--accent-soft); outline: none; transform: scale(1.05);
    }
    .rail-btn[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .rail-spacer { flex: 1; }

    /* ---------- Barra de Busca ---------- */
    .search-bar {
        display: none;
        align-items: center;
        gap: 1rem;
        margin: var(--safe-y) var(--safe-x) 0;
        background: var(--surface);
        border: 3px solid var(--border);
        border-radius: 14px;
        padding: 0.4rem 1.2rem;
        flex-shrink: 0;
    }
    .search-bar.open { display: flex; }
    .search-bar svg { width: 1.4rem; height: 1.4rem; color: var(--text-faint); flex: none; }
    .search-bar input {
        flex: 1; background: transparent; border: none; color: var(--text);
        font-size: 1.15rem; padding: 0.8rem 0; font-family: inherit; font-weight: 600;
    }
    .search-bar input:focus { outline: none; }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }

    /* ---------- Cabeçalho da Tela ---------- */
    .view-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--safe-y) var(--safe-x) 1rem;
        flex-shrink: 0;
    }
    .view-title-wrap {
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }
    h1 { 
        font-family: 'Outfit', sans-serif; 
        font-weight: 800; 
        font-size: 2rem; 
        margin: 0; 
        letter-spacing: 0.02em; 
        color: #fff;
    }
    
    .back-btn {
        display: none;
        background: var(--surface);
        color: var(--text);
        border: 3px solid var(--border);
        padding: 0.6rem 1.2rem;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .back-btn:hover, .back-btn:focus-visible {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg);
        outline: none;
        box-shadow: 0 0 0 5px var(--accent-soft);
    }

    /* ---------- Layout Principal (Duas Colunas) ---------- */
    .main-layout {
        display: grid;
        grid-template-columns: 460px 1fr;
        gap: 30px;
        flex-grow: 1;
        padding: 0 var(--safe-x) var(--safe-y);
        overflow: hidden;
    }

    .sidebar-panel {
        background: var(--rail-bg);
        border: 2px solid var(--border);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Botão de Rolagem no Topo */
    .scroll-btn-top {
        background: var(--bg-elevated);
        color: var(--text-dim);
        border: none;
        border-bottom: 2px solid var(--border);
        width: 100%;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .scroll-btn-top svg, .scroll-btn-bottom svg {
        width: 1.4rem;
        height: 1.4rem;
        fill: currentColor;
    }
    .scroll-btn-top:hover, .scroll-btn-top:focus-visible,
    .scroll-btn-bottom:hover, .scroll-btn-bottom:focus-visible {
        background: var(--accent);
        color: var(--bg);
        outline: none;
    }

    .panel-scroll {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
    }
    .panel-scroll::-webkit-scrollbar { width: 10px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

    /* Botão de Rolagem na Base */
    .scroll-btn-bottom {
        background: var(--bg-elevated);
        color: var(--text-dim);
        border: none;
        border-top: 2px solid var(--border);
        width: 100%;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .nav-card {
        appearance: none;
        background: var(--surface);
        border: 3px solid var(--border);
        padding: 20px 22px;
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        width: 100%;
        color: var(--text);
        transition: all 0.2s ease;
    }
    .nav-card .label {
        font-family: 'Outfit', sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
        padding-right: 12px;
    }
    
    .nav-card .badge {
        font-size: 0.85rem;
        background: var(--bg);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-weight: 700;
        border: 2px solid var(--border);
        flex-shrink: 0;
    }

    .nav-card:hover, .nav-card:focus-visible {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg);
        outline: none;
        box-shadow: 0 0 0 6px var(--accent-soft), 0 10px 25px rgba(0,0,0,0.5);
        transform: scale(1.02);
    }
    .nav-card:hover .badge, .nav-card:focus-visible .badge {
        background: var(--bg);
        color: var(--text);
        border-color: var(--bg);
    }

    .category-section-title {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--accent);
        margin: 14px 0 6px 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .hidden { display: none !important; }

    /* ---------- Player de Vídeo ---------- */
    .player-container {
        background: #000;
        border: 2px solid var(--border);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .player-topbar {
        background: var(--bg-elevated);
        padding: 18px 24px;
        border-bottom: 2px solid var(--border);
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--accent);
    }

    .player-stage {
        flex-grow: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    .player-stage video, .player-stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .player-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2.5rem;
        color: var(--text-dim);
        gap: 1rem;
    }
    .player-placeholder h3 { color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; font-size: 1.5rem; }
    .player-placeholder p { margin: 0; font-size: 1.1rem; max-width: 25rem; line-height: 1.4; }

    /* ---------- Empty state ---------- */
    .empty-state {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: 1.2rem; padding: 4rem 1rem; color: var(--text-dim); margin: auto;
    }
    .empty-state h3 { font-family: 'Outfit', sans-serif; color: var(--text); margin: 0; font-size: 1.3rem; }
    .empty-state p { margin: 0; font-size: 1rem; }

    /* ---------- Botões Gerais ---------- */
    .btn {
        background: var(--surface); color: var(--text); border: 3px solid var(--border);
        padding: 0.9rem 1.6rem; font-size: 1.1rem; font-weight: 700; border-radius: 12px; cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn:hover, .btn:focus-visible {
        border-color: var(--accent); background: var(--accent); color: var(--bg); outline: none;
        box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 800; }

    /* ---------- Modal de Configurações ---------- */
    #settings-modal {
        display: none; position: fixed; inset: 0; background: rgba(7, 8, 10, 0.92);
        backdrop-filter: blur(6px); z-index: 100; padding: var(--safe-y) var(--safe-x); overflow-y: auto;
    }
    .settings-content {
        max-width: 50rem; margin: 3vh auto; background: var(--bg-elevated); border: 2px solid var(--border);
        padding: 2.8rem; border-radius: 22px; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    .settings-header { margin-bottom: 2rem; }
    .settings-header h2 { padding: 0; margin-bottom: 0.5rem; font-size: 1.8rem; }
    .settings-header p { margin: 0; color: var(--text-dim); font-size: 1.1rem; }

    .field-label { display: block; font-size: 1rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.6rem; }
    .import-container { display: flex; gap: 0.8rem; }

    input[type="text"] {
        flex-grow: 1; background: var(--surface); color: var(--text); border: 3px solid var(--border);
        padding: 1rem 1.2rem; font-size: 1.1rem; border-radius: 12px; font-family: inherit; font-weight: 600;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.8rem;
        background: var(--surface);
        padding: 1rem 1.2rem;
        border-radius: 12px;
        border: 2px solid var(--border);
        cursor: pointer;
    }
    .checkbox-container input {
        width: 1.5rem;
        height: 1.5rem;
        accent-color: var(--accent);
        cursor: pointer;
    }
    .checkbox-container span {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
    }

    textarea {
        width: 100%; background: var(--surface); color: var(--text); border: 3px solid var(--border);
        margin-top: 1.8rem; padding: 1.2rem; font-size: 1.05rem; border-radius: 12px;
        font-family: monospace; height: 14rem; resize: vertical; line-height: 1.5;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    ::placeholder { color: var(--text-faint); font-size: 1.05rem; }

    #import-msg { margin-top: 0.8rem; font-size: 1rem; min-height: 1.2em; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    #import-msg.ok { color: var(--ok); }
    #import-msg.err { color: var(--danger); }
    .settings-actions { margin-top: 2rem; display: flex; gap: 1rem; }
</style>
</head>
<body>

<aside class="rail" aria-label="Navegação principal">
    <span class="rail-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="#07080a"/></svg></span>
    <button id="rail-search" class="rail-btn" aria-label="Buscar" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button id="rail-home" class="rail-btn" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11a1 1 0 0 0 1 1h3v-7h6v7h3a1 1 0 0 0 1-1V9"/></svg>
    </button>
    <span class="rail-spacer"></span>
    <button id="rail-settings" class="rail-btn" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </button>
</aside>

<div class="search-bar" id="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="input-search" placeholder="Escreva o nome do canal..." aria-label="Buscar canal">
</div>

<div class="view-header">
    <div class="view-title-wrap">
        <button id="btn-back" class="back-btn">← Voltar</button>
        <h1 id="view-title">Início</h1>
    </div>
</div>

<main class="main-layout">
    <div class="sidebar-panel">
        <!-- Botão para Subir no Topo -->
        <button class="scroll-btn-top" onclick="scrollPanel(-280)" title="Subir Lista">
            <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
        </button>

        <div class="panel-scroll" id="panel-content"></div>

        <!-- Botão para Descer na Base -->
        <button class="scroll-btn-bottom" onclick="scrollPanel(280)" title="Descer Lista">
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
    </div>

    <div class="player-container">
        <div class="player-topbar">
            <span id="player-title">Nenhum canal selecionado</span>
        </div>
        <div class="player-stage" id="player-stage">
            <div class="player-placeholder">
                <h3>Como Assistir</h3>
                <p>Escolha um canal ao lado para começar a ver.</p>
            </div>
        </div>
    </div>
</main>

<!-- Modal Configurações -->
<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-content">
        <div class="settings-header">
            <h2 id="settings-title">Configurações</h2>
            <p>Gerencie suas listas e opções de visualização.</p>
        </div>

        <label class="field-label" for="input-link">Endereço da Lista (Link)</label>
        <div class="import-container">
            <input type="text" id="input-link" placeholder="Cole o link aqui...">
            <button id="btn-import" class="btn">Carregar</button>
        </div>
        <div id="import-msg"></div>

        <label class="checkbox-container">
            <input type="checkbox" id="chk-categories">
            <span>Separar canais por categorias na tela inicial</span>
        </label>

        <label class="field-label" for="input-config" style="margin-top:1.5rem;">Ou Cole o Conteúdo da Lista</label>
        <textarea id="input-config" placeholder="Cole o texto da lista aqui..."></textarea>

        <div class="settings-actions">
            <button id="btn-save" class="btn primary">Salvar e Atualizar</button>
            <button id="btn-close" class="btn">Cancelar</button>
        </div>
    </div>
</div>

<script>
    const panelContent = document.getElementById('panel-content');
    const viewTitle = document.getElementById('view-title');
    const btnBack = document.getElementById('btn-back');
    const settingsModal = document.getElementById('settings-modal');
    const inputConfig = document.getElementById('input-config');
    const inputLink = document.getElementById('input-link');
    const chkCategories = document.getElementById('chk-categories');
    const inputSearch = document.getElementById('input-search');
    const searchBar = document.getElementById('search-bar');
    const railSearch = document.getElementById('rail-search');
    const railHome = document.getElementById('rail-home');
    const railSettings = document.getElementById('rail-settings');
    const btnImport = document.getElementById('btn-import');
    const importMsg = document.getElementById('import-msg');

    const playerStage = document.getElementById('player-stage');
    const playerTitle = document.getElementById('player-title');

    let parsedData = { template: '', categories: {} };
    let currentView = 'home';
    let activeCategory = null;
    let currentHls = null;

    function loadConfig() {
        return localStorage.getItem('portal_configText') || '';
    }

    function loadUseCategories() {
        const val = localStorage.getItem('portal_useCategories');
        return val !== null ? val === 'true' : true;
    }

    function scrollPanel(amount) {
        panelContent.scrollBy({ top: amount, behavior: 'smooth' });
    }

    function parseConfig(configText) {
        const categories = {};
        if (!configText || configText.trim() === '') return { template: '', categories };

        const lines = configText.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) return { template: '', categories };

        const templateLine = lines[0].split(';')[0].split('\t')[0];
        const template = templateLine.replace(/"/g, '').trim();

        for (let i = 1; i < lines.length; i++) {
            let currentLine = lines[i];
            let parts = [];

            if (currentLine.includes('\t')) parts = currentLine.split('\t');
            else if (currentLine.includes(';')) parts = currentLine.split(';');
            else if (currentLine.includes(',')) parts = currentLine.split(',');

            if (parts.length >= 3) {
                const category = parts[0].replace(/"/g, '').trim();
                const name = parts[1].replace(/"/g, '').trim();
                const id = parts[2].replace(/"/g, '').trim();

                if (category && name && id) {
                    if (!categories[category]) categories[category] = [];
                    categories[category].push({ name, id });
                }
            }
        }
        return { template, categories };
    }

    function renderHome() {
        const useCategories = loadUseCategories();
        parsedData = parseConfig(loadConfig());
        const categories = parsedData.categories;

        if (Object.keys(categories).length === 0) {
            currentView = 'home';
            viewTitle.textContent = 'Início';
            btnBack.style.display = 'none';
            panelContent.innerHTML = `
                <div class="empty-state">
                    <h3>Nenhum canal encontrado</h3>
                    <p>Clique no botão de engrenagem na barra lateral para configurar sua lista.</p>
                    <button class="btn primary" id="btn-empty-settings" style="margin-top:15px;">Configurar Agora</button>
                </div>`;
            const btn = document.getElementById('btn-empty-settings');
            if(btn) btn.addEventListener('click', openModal);
            return;
        }

        if (useCategories) {
            currentView = 'categories-home';
            viewTitle.textContent = 'Escolha uma Categoria';
            btnBack.style.display = 'none';

            let html = '';
            for (const catName in categories) {
                const count = categories[catName].length;
                html += `<button type="button" class="nav-card" onclick="openCategory('${catName.replace(/'/g, "\\'")}')">
                            <span class="label">${catName}</span>
                            <span class="badge">${count}</span>
                         </button>`;
            }
            panelContent.innerHTML = html;
        } else {
            currentView = 'all-channels';
            viewTitle.textContent = 'Todos os Canais';
            btnBack.style.display = 'none';

            let allChannels = [];
            for (const catName in categories) {
                categories[catName].forEach(item => {
                    let link = parsedData.template;
                    if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
                    else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);
                    allChannels.push({ name: item.name, link, category: catName });
                });
            }

            allChannels.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

            let html = '';
            allChannels.forEach(item => {
                const safeName = item.name.replace(/"/g, '&quot;');
                html += `<button type="button" class="nav-card" 
                            onclick="openPlayer('${item.link.replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">
                            <span class="label">${item.name}</span>
                            <span style="font-size:0.8rem; font-weight:700; color:var(--text-faint);">ASSISTIR ▶</span>
                         </button>`;
            });
            panelContent.innerHTML = html;
        }

        setTimeout(() => {
            const first = panelContent.querySelector('.nav-card');
            if (first) first.focus();
        }, 50);
    }

    function openCategory(catName) {
        currentView = 'category-details';
        activeCategory = catName;
        viewTitle.textContent = catName;
        btnBack.style.display = 'block';

        const items = parsedData.categories[catName] || [];
        let html = '';
        items.forEach(item => {
            let link = parsedData.template;
            if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
            else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);

            const safeName = item.name.replace(/"/g, '&quot;');
            html += `<button type="button" class="nav-card" 
                        onclick="openPlayer('${link.replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">
                        <span class="label">${item.name}</span>
                        <span style="font-size:0.8rem; font-weight:700; color:var(--text-faint);">ASSISTIR ▶</span>
                     </button>`;
        });
        panelContent.innerHTML = html;

        setTimeout(() => {
            const first = panelContent.querySelector('.nav-card');
            if (first) first.focus();
        }, 50);
    }

    btnBack.addEventListener('click', () => {
        renderHome();
    });

    /* ---------- Busca ---------- */
    function applySearch() {
        const query = inputSearch.value.trim().toLowerCase();
        if (!query) {
            renderHome();
            return;
        }

        currentView = 'search';
        viewTitle.textContent = 'Resultados da Busca';
        btnBack.style.display = 'block';

        let html = '';
        for (const catName in parsedData.categories) {
            parsedData.categories[catName].forEach(item => {
                if (item.name.toLowerCase().includes(query)) {
                    let link = parsedData.template;
                    if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
                    else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);

                    const safeName = item.name.replace(/"/g, '&quot;');
                    html += `<button type="button" class="nav-card" 
                                onclick="openPlayer('${link.replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">
                                <span class="label">${item.name} <small style="color:var(--text-dim); display:block; font-size:0.85rem; margin-top:4px;">Categoria: ${catName}</small></span>
                             </button>`;
                }
            });
        }
        panelContent.innerHTML = html || '<div class="empty-state"><h3>Nenhum canal encontrado com esse nome</h3></div>';
    }
    inputSearch.addEventListener('input', applySearch);

    railSearch.addEventListener('click', () => {
        if (searchBar.classList.contains('open')) {
            searchBar.classList.remove('open');
            railSearch.setAttribute('aria-pressed', 'false');
            inputSearch.value = '';
            renderHome();
        } else {
            searchBar.classList.add('open');
            railSearch.setAttribute('aria-pressed', 'true');
            inputSearch.focus();
        }
    });

    railHome.addEventListener('click', () => {
        searchBar.classList.remove('open');
        inputSearch.value = '';
        renderHome();
    });

    /* ---------- Player ---------- */
    function loadHlsScript(cb) {
        if (window.Hls) { cb(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js';
        s.onload = cb;
        s.onerror = () => cb();
        document.head.appendChild(s);
    }

    function openPlayer(url, name) {
        if (!url) return;
        playerTitle.textContent = "Assistindo: " + name;
        playerStage.innerHTML = '';
        if (currentHls) { currentHls.destroy(); currentHls = null; }

        const isHls = /\.m3u8(\?|$)/i.test(url);
        const isDirectVideo = /\.(mp4|webm|ogg|mov|mkv)(\?|$)/i.test(url);

        if (isHls) {
            const video = document.createElement('video');
            video.controls = true; video.autoplay = true; video.playsInline = true;
            playerStage.appendChild(video);
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            } else {
                loadHlsScript(() => {
                    if (window.Hls && window.Hls.isSupported()) {
                        currentHls = new window.Hls();
                        currentHls.loadSource(url);
                        currentHls.attachMedia(video);
                    } else {
                        video.src = url;
                    }
                });
            }
        } else if (isDirectVideo) {
            const video = document.createElement('video');
            video.controls = true; video.autoplay = true; video.playsInline = true; video.src = url;
            playerStage.appendChild(video);
        } else {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
            iframe.allowFullscreen = true;
            playerStage.appendChild(iframe);
        }
    }

    /* ---------- Configurações ---------- */
    function setImportMsg(text, type) {
        importMsg.className = type || '';
        importMsg.textContent = text;
    }

    btnImport.addEventListener('click', async () => {
        const url = inputLink.value.trim();
        if (!url) { setImportMsg('Por favor, digite um link válido.', 'err'); return; }
        setImportMsg('Carregando lista, aguarde...', '');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Erro');
            const text = await response.text();
            inputConfig.value = text;
            setImportMsg('Lista carregada com sucesso!', 'ok');
        } catch (error) {
            try {
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                const responseProxy = await fetch(proxyUrl);
                if (!responseProxy.ok) throw new Error('Erro');
                const text = await responseProxy.text();
                inputConfig.value = text;
                setImportMsg('Lista carregada com sucesso!', 'ok');
            } catch (errProxy) {
                setImportMsg('Não foi possível carregar este link.', 'err');
            }
        }
    });

    function openModal() {
        inputConfig.value = loadConfig();
        chkCategories.checked = loadUseCategories();
        setImportMsg('', '');
        inputLink.value = '';
        settingsModal.style.display = 'block';
        inputLink.focus();
    }
    function closeModal() {
        settingsModal.style.display = 'none';
        railSettings.focus();
    }
    railSettings.addEventListener('click', openModal);
    document.getElementById('btn-close').addEventListener('click', closeModal);

    document.getElementById('btn-save').addEventListener('click', () => {
        localStorage.setItem('portal_configText', inputConfig.value);
        localStorage.setItem('portal_useCategories', chkCategories.checked);
        settingsModal.style.display = 'none';
        searchBar.classList.remove('open');
        inputSearch.value = '';
        renderHome();
    });

    window.onload = () => { renderHome(); };
</script>
</body>
</html>
