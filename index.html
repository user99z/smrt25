<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TV Lite</title>
<style>
:root{
  --bg:#eef4f7;
  --panel:#ffffff;
  --panel2:#e7eef3;
  --text:#163047;
  --muted:#607487;
  --blue:#1768b5;
  --blue2:#0d4c88;
  --focus:#f5b400;
  --line:#d2dde5;
  --rail:118px;
  --gap:18px;
  --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
button,a,input,textarea{font:inherit}
button,a{outline:none}
a{text-decoration:none;color:inherit}
body{background:linear-gradient(135deg,#f6fafc 0%,#e6eef4 55%,#d9e5ec 100%)}

/* Barra principal: sem blur, sem transparência pesada, sem animação */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);padding:20px 14px;background:#16324a;display:flex;flex-direction:column;gap:14px;z-index:5}
.rail-btn{height:92px;border:3px solid transparent;border-radius:18px;background:transparent;color:#d7e5ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:18px;cursor:pointer}
.rail-btn svg{width:34px;height:34px}
.rail-btn.active{background:#214866;color:#fff}
.rail-btn.selected,.rail-btn:focus{border-color:var(--focus);background:#fff;color:#14324a}
.rail-spacer{flex:1}

.app{height:100%;margin-left:var(--rail);overflow:hidden}
.view{display:none;height:100%;padding:28px 36px 24px;overflow:hidden}
.view.active{display:flex;flex-direction:column}
.header{height:84px;display:flex;align-items:center;gap:18px;flex:0 0 auto}
.header h1{margin:0;font-size:42px;line-height:1;font-weight:800;letter-spacing:-1px}
.header p{margin:7px 0 0;font-size:20px;color:var(--muted);font-weight:600}
.back{height:62px;min-width:126px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--text);font-weight:800;font-size:20px;cursor:pointer}
.back.selected,.back:focus{border-color:var(--focus);background:#fff7d6}
.header-copy{min-width:0}

.home-title{padding-top:6px}
.home-title h1{font-size:46px}
.home-title p{font-size:21px}

.content{flex:1;min-height:0;display:flex;flex-direction:column}
#view-category .content{overflow-y:auto;overflow-x:hidden;padding-right:6px}
#view-category .content::-webkit-scrollbar{width:8px}
#view-category .content::-webkit-scrollbar-thumb{background:#b8c7d2;border-radius:8px}
.section-head{height:56px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.section-head h2{margin:0;font-size:27px}
.meta{color:var(--muted);font-weight:700;font-size:17px}

.category-grid,.channel-grid{display:grid;gap:var(--gap);align-content:start}
.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.category-card{height:164px;padding:24px;border:4px solid transparent;border-radius:var(--radius);background:var(--card,#1768b5);color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.category-card:nth-child(6n+1){--card:#1768b5}.category-card:nth-child(6n+2){--card:#2b7c69}.category-card:nth-child(6n+3){--card:#695f95}.category-card:nth-child(6n+4){--card:#a5652c}.category-card:nth-child(6n+5){--card:#55753b}.category-card:nth-child(6n+6){--card:#3a6d89}
.category-card.selected,.category-card:focus{border-color:var(--focus);background:var(--card,#1768b5)}
.cat-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;min-width:0}
.cat-name{min-width:0;font-size:27px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{flex:0 0 auto;font-size:16px;font-weight:800;line-height:1;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.20);white-space:nowrap}
.cat-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;font-weight:900}

.channel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.channel-card{height:132px;padding:18px;border:4px solid transparent;border-radius:var(--radius);background:var(--panel);display:flex;align-items:center;gap:16px;cursor:pointer}
.channel-card.selected,.channel-card:focus{border-color:var(--focus);background:#fff8dd}
.channel-logo{width:78px;height:78px;border-radius:18px;background:#2a678f;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;flex:0 0 auto}
.channel-info{min-width:0}.channel-name{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-cat{margin-top:7px;color:var(--muted);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pager{height:64px;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:16px;flex:0 0 auto}
.page-btn{height:48px;min-width:102px;padding:0 18px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:800;font-size:18px;cursor:pointer}
.page-btn:disabled{opacity:.35}
.page-btn.selected,.page-btn:focus{border-color:var(--focus);background:#fff7d6}
.page-label{min-width:120px;text-align:center;color:var(--muted);font-weight:800}

.settings-panel{max-width:1380px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:22px;overflow:auto;padding-bottom:8px}
.box{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px}
.label{display:block;font-size:20px;font-weight:800;margin-bottom:9px}
.help{font-size:16px;line-height:1.35;color:var(--muted);margin:0 0 14px}
.input-row{display:flex;gap:10px}
.text-input,.config-area{width:100%;border:4px solid var(--line);border-radius:15px;background:#fff;color:var(--text);padding:14px 16px;font-size:18px}
.text-input{height:60px}.config-area{height:240px;resize:none;font-family:monospace;line-height:1.35}
.text-input.selected,.text-input:focus,.config-area.selected,.config-area:focus{border-color:var(--focus)}
.action{height:60px;padding:0 22px;border:4px solid transparent;border-radius:15px;background:var(--blue);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.action.secondary{background:#fff;color:var(--text);border-color:var(--line)}
.action.selected,.action:focus{border-color:var(--focus)}
.check-row{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.check-row input{width:28px;height:28px}
.settings-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px}
#import-msg{margin-top:10px;min-height:22px;font-weight:700}.ok{color:#267152}.err{color:#a13030}

.empty{grid-column:1/-1;height:200px;border:3px dashed #b9c8d3;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;color:var(--muted)}
.empty strong{font-size:25px;color:var(--text);margin-bottom:8px}
.hidden{display:none!important}

/* 720p */
@media(max-height:800px){
  :root{--rail:98px;--gap:12px}.rail{padding:12px 10px}.rail-btn{height:74px;font-size:15px}.rail-btn svg{width:28px;height:28px}.view{padding:18px 24px 14px}.header{height:68px}.header h1,.home-title h1{font-size:34px}.header p,.home-title p{font-size:17px}.section-head{height:44px}.section-head h2{font-size:22px}.category-card{height:126px;padding:18px}.cat-name{font-size:22px}.cat-count{font-size:15px}.channel-card{height:102px;padding:12px}.channel-logo{width:62px;height:62px;border-radius:14px}.channel-name{font-size:19px}.channel-cat{font-size:14px}.pager{height:52px}.page-btn{height:42px}.box{padding:16px}.config-area{height:170px}
}
/* telas menores/largura limitada */
@media(max-width:1150px){.category-grid,.channel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-panel{grid-template-columns:1fr}}
/* 4K / telas grandes */
@media(min-width:2200px){:root{--rail:160px;--gap:28px}.rail-btn{height:126px;font-size:24px}.rail-btn svg{width:48px;height:48px}.view{padding:50px 64px 38px}.header{height:116px}.header h1,.home-title h1{font-size:62px}.header p,.home-title p{font-size:28px}.section-head{height:78px}.section-head h2{font-size:38px}.category-grid,.channel-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.category-card{height:220px;padding:32px}.cat-name{font-size:37px}.cat-count{font-size:23px}.channel-card{height:176px;padding:24px}.channel-logo{width:108px;height:108px;font-size:30px}.channel-name{font-size:30px}.channel-cat{font-size:22px}.pager{height:86px}.page-btn{height:62px;font-size:24px}.page-label{font-size:22px}}
</style>
</head>
<body tabindex="-1">
<nav class="rail" aria-label="Menu principal">
  <button id="nav-home" class="rail-btn active nav-item" data-nav type="button" autofocus>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/><path d="M9 21v-7h6v7"/></svg><span>Início</span>
  </button>
  <div class="rail-spacer"></div>
  <button id="nav-settings" class="rail-btn nav-item" data-nav type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>Ajustes</span>
  </button>
</nav>

<div class="app">
  <main id="view-home" class="view active">
    <header class="header home-title"><div class="header-copy"><h1>Escolha o que assistir</h1><p>Use as setas do controle e pressione OK.</p></div></header>
    <div class="content">
      <div id="home-categories-section">
        <div class="section-head"><h2>Categorias</h2><span id="home-category-meta" class="meta"></span></div>
        <div id="home-categories" class="category-grid"></div>
      </div>
      <div id="home-all-section" class="hidden">
        <div class="section-head"><h2>Canais</h2><span id="home-channel-meta" class="meta"></span></div>
        <div id="home-channels" class="channel-grid"></div>
        <div id="home-pager" class="pager"></div>
      </div>
    </div>
  </main>

  <main id="view-category" class="view">
    <header class="header"><button class="back js-back" data-nav type="button">← Voltar</button><div class="header-copy"><h1 id="category-title">Categoria</h1><p id="category-subtitle"></p></div></header>
    <div class="content"><div id="category-channels" class="channel-grid"></div></div>
  </main>

  <main id="view-settings" class="view">
    <header class="header"><button class="back js-back" data-nav type="button">← Voltar</button><div class="header-copy"><h1>Ajustes</h1><p>Gerencie a lista de canais.</p></div></header>
    <div class="content">
      <section class="settings-panel">
        <div class="box">
          <label class="label" for="input-link">Importar por link</label>
          <p class="help">Cole o endereço da lista.</p>
          <div class="input-row"><input id="input-link" class="text-input" data-nav type="text" inputmode="url" placeholder="https://..."><button id="btn-import" class="action" data-nav type="button">Carregar</button></div>
          <div id="import-msg"></div>
          <label class="check-row"><input id="chk-categories" type="checkbox"><span>Mostrar categorias na tela inicial</span></label>
        </div>
        <div class="box">
          <label class="label" for="input-config">Conteúdo da lista</label>
          <p class="help">Cole ou edite a lista manualmente.</p>
          <textarea id="input-config" class="config-area" data-nav spellcheck="false"></textarea>
        </div>
        <div class="settings-actions"><button id="btn-cancel" class="action secondary" data-nav type="button">Cancelar</button><button id="btn-save" class="action" data-nav type="button">Salvar</button></div>
      </section>
    </div>
  </main>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const views={home:$('view-home'),category:$('view-category'),settings:$('view-settings')};
const navHome=$('nav-home'),navSettings=$('nav-settings');
const homeCategories=$('home-categories'),homeChannels=$('home-channels'),categoryChannels=$('category-channels');
const inputConfig=$('input-config'),inputLink=$('input-link'),chkCategories=$('chk-categories'),importMsg=$('import-msg');
const PAGE_SIZE=12;
let parsedData={template:'',categories:{}};
let currentView='home',currentCategory='',currentPage=0;
let selected=null;
let focusKickTimer=null;

function loadConfig(){return localStorage.getItem('portal_configText')||''}
function loadUseCategories(){const v=localStorage.getItem('portal_useCategories');return v!==null?v==='true':true}
function parseConfig(text){
  const categories={};
  if(!text||!text.trim())return{template:'',categories};
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2)return{template:'',categories};
  const template=lines[0].split(';')[0].split('\t')[0].replace(/"/g,'').trim();
  for(let i=1;i<lines.length;i++){
    let p=[];const line=lines[i];
    if(line.indexOf('\t')>=0)p=line.split('\t');else if(line.indexOf(';')>=0)p=line.split(';');else if(line.indexOf(',')>=0)p=line.split(',');
    if(p.length>=3){const c=p[0].replace(/"/g,'').trim(),n=p[1].replace(/"/g,'').trim(),id=p[2].replace(/"/g,'').trim();if(c&&n&&id){if(!categories[c])categories[c]=[];categories[c].push({name:n,id:id})}}
  }
  return{template:template,categories:categories};
}
function buildLink(id){let u=parsedData.template||'';if(u.indexOf('[CANAL]')>=0)u=u.split('[CANAL]').join(id);else if(u.indexOf('[ID]')>=0)u=u.split('[ID]').join(id);return u}
function getAllChannels(){const out=[];for(const c in parsedData.categories){const items=parsedData.categories[c];for(let i=0;i<items.length;i++)out.push({name:items[i].name,category:c,link:buildLink(items[i].id)})}out.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));return out}
function initials(name){const p=(name||'TV').replace(/[^A-Za-zÀ-ÿ0-9 ]/g,' ').trim().split(/\s+/);return(p.length>1?(p[0][0]+p[1][0]):(p[0]||'TV').slice(0,2)).toUpperCase()}
function colorFor(name){const c=['#1768b5','#2b7c69','#695f95','#a5652c','#55753b','#3a6d89'];let h=0;for(let i=0;i<name.length;i++)h=((h<<5)-h+name.charCodeAt(i))|0;return c[Math.abs(h)%c.length]}

function markNav(el){el.setAttribute('data-nav','');el.addEventListener('mouseenter',()=>select(el,false));return el}
function categoryCard(name,count){const b=markNav(document.createElement('button'));b.type='button';b.className='category-card';b.innerHTML='<span class="cat-icon">TV</span><span class="cat-bottom"><span class="cat-name"></span><span class="cat-count"></span></span>';b.querySelector('.cat-name').textContent=name;b.querySelector('.cat-count').textContent=count+(count===1?' canal':' canais');b.onclick=()=>openCategory(name);return b}
function channelCard(ch){const a=markNav(document.createElement('a'));a.className='channel-card';a.href=ch.link||'#';a.target='_blank';a.rel='noopener noreferrer';const logo=document.createElement('div');logo.className='channel-logo';logo.style.background=colorFor(ch.name);logo.textContent=initials(ch.name);const info=document.createElement('div');info.className='channel-info';const n=document.createElement('div');n.className='channel-name';n.textContent=ch.name;const c=document.createElement('div');c.className='channel-cat';c.textContent=ch.category;info.appendChild(n);info.appendChild(c);a.appendChild(logo);a.appendChild(info);return a}
function empty(container,title,text){container.innerHTML='';const d=document.createElement('div');d.className='empty';const s=document.createElement('strong');s.textContent=title;const p=document.createElement('span');p.textContent=text;d.appendChild(s);d.appendChild(p);container.appendChild(d)}

function renderPager(container,page,total,onChange){container.innerHTML='';const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));if(pages<=1)return;const prev=markNav(document.createElement('button'));prev.className='page-btn';prev.type='button';prev.textContent='← Anterior';prev.disabled=page<=0;prev.onclick=()=>onChange(page-1);const label=document.createElement('span');label.className='page-label';label.textContent=(page+1)+' / '+pages;const next=markNav(document.createElement('button'));next.className='page-btn';next.type='button';next.textContent='Próxima →';next.disabled=page>=pages-1;next.onclick=()=>onChange(page+1);container.appendChild(prev);container.appendChild(label);container.appendChild(next)}
function renderChannelPage(container,pager,list,page,onChange){const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.max(0,Math.min(page,pages-1));container.innerHTML='';if(!list.length){empty(container,'Nenhum canal encontrado','Confira a lista nos Ajustes.');pager.innerHTML='';return page}const start=page*PAGE_SIZE;for(let i=start;i<Math.min(start+PAGE_SIZE,list.length);i++)container.appendChild(channelCard(list[i]));renderPager(pager,page,list.length,onChange);return page}

function showView(name){currentView=name;for(const k in views)views[k].classList.toggle('active',k===name);navHome.classList.toggle('active',name==='home');navSettings.classList.toggle('active',name==='settings')}
function renderHome(){parsedData=parseConfig(loadConfig());showView('home');currentPage=0;const cats=Object.keys(parsedData.categories).sort((a,b)=>a.localeCompare(b,'pt-BR'));$('home-category-meta').textContent=cats.length?cats.length+' categorias':'';homeCategories.innerHTML='';const useCats=loadUseCategories()&&cats.length>0;$('home-categories-section').classList.toggle('hidden',!useCats);$('home-all-section').classList.toggle('hidden',useCats);if(useCats){for(let i=0;i<cats.length;i++)homeCategories.appendChild(categoryCard(cats[i],parsedData.categories[cats[i]].length));if(!cats.length)empty(homeCategories,'Nenhuma categoria','Abra Ajustes para configurar sua lista.')}else{const all=getAllChannels();$('home-channel-meta').textContent=all.length+' canais';const turnPage=function(p){currentPage=renderChannelPage(homeChannels,$('home-pager'),all,p,turnPage);selectFirstContent()};currentPage=renderChannelPage(homeChannels,$('home-pager'),all,currentPage,turnPage)}selectFirstContent()}
function renderCategory(name){parsedData=parseConfig(loadConfig());showView('category');currentCategory=name;const src=(parsedData.categories[name]||[]).map(x=>({name:x.name,category:name,link:buildLink(x.id)}));src.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));$('category-title').textContent=name;$('category-subtitle').textContent=src.length+(src.length===1?' canal':' canais');categoryChannels.innerHTML='';if(!src.length){empty(categoryChannels,'Nenhum canal encontrado','Esta categoria está vazia.')}else{for(let i=0;i<src.length;i++)categoryChannels.appendChild(channelCard(src[i]))}const scroller=document.querySelector('#view-category .content');if(scroller)scroller.scrollTop=0;selectFirstContent()}
function renderSettings(){showView('settings');inputConfig.value=loadConfig();inputLink.value='';chkCategories.checked=loadUseCategories();setImportMsg('');select(document.querySelector('#view-settings .js-back'),true)}

function state(){return history.state&&history.state.view?history.state:{view:'home'}}
function push(s){history.pushState(s,'','#'+s.view);if(s.view==='category')renderCategory(s.category);else if(s.view==='settings')renderSettings();else renderHome()}
function openCategory(n){push({view:'category',category:n})}
function goHome(){if(currentView==='home'){renderHome();return}push({view:'home'})}
function openSettings(){if(currentView==='settings'){renderSettings();return}push({view:'settings'})}
function goBack(){if(currentView!=='home'){history.back()}else{select(navHome,true)}}

navHome.onclick=goHome;navSettings.onclick=openSettings;document.querySelectorAll('.js-back').forEach(x=>x.onclick=goBack);$('btn-cancel').onclick=goBack;
function setImportMsg(t,type){importMsg.className=type||'';importMsg.textContent=t||''}
$('btn-import').onclick=async()=>{const url=inputLink.value.trim();if(!url){setImportMsg('Digite um link válido.','err');return}setImportMsg('Carregando...','');try{let r=await fetch(url);if(!r.ok)throw 0;inputConfig.value=await r.text();setImportMsg('Lista carregada.','ok')}catch(e){try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));if(!r.ok)throw 0;inputConfig.value=await r.text();setImportMsg('Lista carregada.','ok')}catch(e2){setImportMsg('Falha ao carregar. Cole a lista manualmente.','err')}}};
$('btn-save').onclick=()=>{localStorage.setItem('portal_configText',inputConfig.value);localStorage.setItem('portal_useCategories',String(chkCategories.checked));setImportMsg('Salvo.','ok');setTimeout(goBack,100)};

/* Navegação própria: a seleção não depende do :focus do navegador. */
function navItems(){return Array.prototype.slice.call(document.querySelectorAll('.view.active [data-nav]:not([disabled]), .rail [data-nav]:not([disabled])')).filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0})}
function select(el,doFocus){if(!el)return;if(selected)selected.classList.remove('selected');selected=el;selected.classList.add('selected');if(doFocus!==false){try{selected.focus({preventScroll:true})}catch(e){try{selected.focus()}catch(_){}}}if(selected.scrollIntoView){try{selected.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}}}
function selectFirstContent(){setTimeout(()=>{let el=document.querySelector('.view.active [data-nav]:not(.js-back):not([disabled])')||document.querySelector('.view.active [data-nav]:not([disabled])')||navHome;select(el,true)},0)}
function move(code){const items=navItems();if(!items.length)return;if(!selected||items.indexOf(selected)<0){selectFirstContent();return}const c=selected.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,score=1e9;for(let i=0;i<items.length;i++){const el=items[i];if(el===selected)continue;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-cx,dy=y-cy;if(code===39&&dx<=4)continue;if(code===37&&dx>=-4)continue;if(code===40&&dy<=4)continue;if(code===38&&dy>=-4)continue;const pri=(code===37||code===39)?Math.abs(dx):Math.abs(dy);const sec=(code===37||code===39)?Math.abs(dy):Math.abs(dx);const s=pri+sec*2;if(s<score){score=s;best=el}}if(best)select(best,true)}
function isText(el){return el===inputLink||el===inputConfig}
function activate(){if(!selected)return;if(selected.tagName==='A'){selected.click();return}if(typeof selected.click==='function')selected.click()}
let lastKeyCode=0,lastKeyAt=0;
function keyHandler(e){
  const code=e.keyCode||e.which||0;
  if(!code)return;
  const now=Date.now();
  if(e.type==='keyup'&&code===lastKeyCode&&now-lastKeyAt<1500)return;
  if(e.type==='keydown'){lastKeyCode=code;lastKeyAt=now}
  const active=document.activeElement;
  const editing=isText(active);
  if(editing){
    if(code===461||code===27){e.preventDefault();e.stopPropagation();active.blur();select(document.querySelector('.view.active .js-back')||navHome,true)}
    return;
  }
  if(code===37||code===38||code===39||code===40){e.preventDefault();e.stopPropagation();if(!selected)selectFirstContent();else move(code);return}
  if(code===13){e.preventDefault();e.stopPropagation();activate();return}
  if(code===461||code===27||code===8){e.preventDefault();e.stopPropagation();goBack();return}
}
window.addEventListener('keydown',keyHandler,true);
window.addEventListener('keyup',keyHandler,true);

/* Ao mover o Magic Remote, o item apontado também vira o item selecionado. */
document.addEventListener('mouseover',e=>{let el=e.target.closest&&e.target.closest('[data-nav]');if(el)select(el,true)},false);
document.addEventListener('pointerdown',()=>{setTimeout(forceAppFocus,0)},true);

/* Força o foco de volta ao documento e ao item lógico selecionado. */
function forceAppFocus(){
  const active=document.activeElement;
  if(isText(active))return;
  try{window.focus()}catch(e){}
  try{document.body.focus({preventScroll:true})}catch(e){try{document.body.focus()}catch(_){}}
  if(!selected||!document.documentElement.contains(selected)||selected.offsetParent===null)selectFirstContent();else select(selected,true);
}
function kickFocus(){
  let n=0;
  clearInterval(focusKickTimer);
  forceAppFocus();
  focusKickTimer=setInterval(()=>{n++;forceAppFocus();if(n>=40)clearInterval(focusKickTimer)},150);
}
window.addEventListener('focus',()=>{kickFocus()});
window.addEventListener('load',()=>{kickFocus()});
window.addEventListener('pageshow',()=>{kickFocus()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kickFocus()});
window.addEventListener('popstate',e=>{const s=e.state||{view:'home'};if(s.view==='guard'){history.pushState({view:'home'},'','#home');renderHome();select(navHome,true);kickFocus();return}if(s.view==='category')renderCategory(s.category);else if(s.view==='settings')renderSettings();else renderHome();kickFocus()});

function boot(){parsedData=parseConfig(loadConfig());history.replaceState({view:'guard'},'','#guard');history.pushState({view:'home'},'','#home');renderHome();select(navHome,true);kickFocus();setTimeout(kickFocus,800);setTimeout(kickFocus,2200)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
</script>
