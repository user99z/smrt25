<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Portal Smart TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0a0a;
        --surface: #121212;
        --border-color: #333333;
        --border-highlight: #555555;
        
        --accent: #eeeeee; 
        --danger: #aa5555; 
        --ok: #55aa55; 
        
        --text: #cccccc;
        --text-active: #ffffff;
        --text-dim: #777777;
        
        --hover-bg: #1c1c1c;
        --active-bg: #252525;
        
        --b-thin: 1px solid var(--border-color);
        
        --rail-w: 80px;
        --rail-h-mobile: 70px;
        --safe-x: clamp(20px, 3vw, 40px);
        --safe-y: clamp(20px, 2.5vh, 40px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; } 

    body {
        background: var(--bg); 
        color: var(--text);
        font-family: 'Space Mono', 'Courier New', Courier, monospace; 
        margin: 0;
        height: 100vh; height: 100dvh; 
        padding-left: var(--rail-w);
        display: flex; flex-direction: column; 
        overflow: hidden;
        /* Removido text-transform para não cansar a vista */
    }

    /* ---------- Navegação Principal (Wireframe) ---------- */
    .rail {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: var(--rail-w); background: var(--bg);
        border-right: var(--b-thin); display: flex;
        flex-direction: column; align-items: center; gap: 1.5rem;
        padding: var(--safe-y) 0; z-index: 60;
    }
    
    .rail-btn {
        width: 50px; height: 50px; 
        background: transparent; color: var(--text-dim);
        border: var(--b-thin); border-radius: 0; 
        display: flex; align-items: center; justify-content: center; 
        cursor: pointer;
        transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .rail-btn svg { width: 24px; height: 24px; stroke-width: 1.5; }
    .rail-btn:hover, .rail-btn:focus-visible { 
        background: var(--hover-bg); color: var(--text);
        border-color: var(--border-highlight);
        outline: none;
    }
    .rail-btn[aria-pressed="true"], .rail-btn.active { 
        background: var(--active-bg); color: var(--text-active);
        border-color: var(--text-dim);
    }
    .rail-spacer { flex: 1; }

    /* ---------- Cabeçalho ---------- */
    .view-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: var(--safe-y) var(--safe-x) 1rem; flex-shrink: 0;
        border-bottom: var(--b-thin);
        background: var(--bg);
        margin-bottom: 20px;
    }
    .view-title-wrap { display: flex; align-items: center; gap: 1.5rem; }
    h1 { font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--text-active); letter-spacing: -0.5px; }
    
    .back-btn {
        display: none; background: transparent; color: var(--text);
        border: var(--b-thin); font-size: 0.9rem;
        cursor: pointer; padding: 0.4rem 0.8rem; 
        font-family: inherit; 
        transition: background-color 0.15s, border-color 0.15s;
    }
    .back-btn:hover { background: var(--hover-bg); border-color: var(--border-highlight); }

    /* ---------- Layout Principal ---------- */
    .main-layout {
        display: grid; grid-template-columns: 350px 1fr; gap: 20px;
        flex-grow: 1; padding: 0 var(--safe-x) var(--safe-y); overflow: hidden;
    }

    .sidebar-panel { display: flex; flex-direction: column; overflow: hidden; }

    .panel-scroll {
        flex-grow: 1; overflow-y: auto; padding-right: 15px;
        display: flex; flex-direction: column; gap: 10px;
    }
    
    /* Barras de Rolagem Minimalistas */
    .panel-scroll::-webkit-scrollbar, .settings-body::-webkit-scrollbar { width: 8px; }
    .panel-scroll::-webkit-scrollbar-track, .settings-body::-webkit-scrollbar-track { background: var(--bg); border-left: var(--b-thin); }
    .panel-scroll::-webkit-scrollbar-thumb, .settings-body::-webkit-scrollbar-thumb { background: var(--border-color); }
    .panel-scroll::-webkit-scrollbar-thumb:hover, .settings-body::-webkit-scrollbar-thumb:hover { background: var(--border-highlight); }

    /* ---------- Cartões Discretos ---------- */
    .nav-card {
        appearance: none; background: var(--surface); border: var(--b-thin);
        padding: 1rem; border-radius: 0; cursor: pointer;
        display: flex; align-items: center; justify-content: space-between;
        text-align: left; width: 100%; color: var(--text);
        transition: background-color 0.15s, border-color 0.15s;
        font-family: inherit;
    }
    .nav-card .label {
        font-size: 0.95rem; font-weight: 400; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; flex-grow: 1; padding-right: 15px;
    }
    .nav-card .badge {
        font-size: 0.85rem; background: var(--bg); padding: 0.2rem 0.6rem;
        color: var(--text-dim); border: var(--b-thin); flex-shrink: 0;
        transition: border-color 0.15s;
    }

    .nav-card:hover, .nav-card:focus-visible { 
        background: var(--hover-bg); color: var(--text-active);
        border-color: var(--border-highlight);
        outline: none;
    }
    .nav-card.active {
        background: var(--active-bg); color: var(--text-active);
        border-color: var(--text-dim);
    }
    .nav-card.active .badge { border-color: var(--text-dim); color: var(--text-active); }

    /* ---------- Player ---------- */
    .player-container {
        background: #000; border: var(--b-thin); display: flex; flex-direction: column;
        overflow: hidden; position: relative; width: 100%; height: 100%;
    }

    .player-topbar {
        background: var(--surface); border-bottom: var(--b-thin);
        padding: 12px 15px; font-weight: 400; font-size: 1rem; color: var(--text-active);
        z-index: 10; 
    }

    .player-stage {
        flex-grow: 1; width: 100%; height: 100%; display: flex; align-items: center;
        justify-content: center; background: #000; position: relative;
    }

    .player-stage video, .player-stage iframe {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border: 0; background: #000; object-fit: contain;
    }

    .player-placeholder {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 2rem; z-index: 5;
    }
    .player-placeholder svg { color: var(--text-dim); width: 60px; height: 60px; margin-bottom: 15px; stroke-width: 1; }
    .player-placeholder h3 { color: var(--text); margin: 0 0 0.5rem; font-size: 1.2rem; font-weight: 400; }
    .player-placeholder p { color: var(--text-dim); margin: 0; font-size: 0.95rem; max-width: 20rem; line-height: 1.5; }

    /* ---------- Empty state ---------- */
    .empty-state {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: 1rem; padding: 3rem 1rem; color: var(--text); margin: auto;
        border: var(--b-thin); background: var(--surface);
    }
    .empty-state h3 { color: var(--text-active); margin: 0; font-size: 1.2rem; font-weight: 400; }
    .empty-state p { margin: 0; font-size: 0.95rem; color: var(--text-dim); }

    /* ---------- Botões ---------- */
    .btn {
        background: var(--surface); color: var(--text); border: var(--b-thin);
        padding: 0.6rem 1.2rem; font-size: 0.95rem; font-weight: 400; 
        border-radius: 0; cursor: pointer; transition: background-color 0.15s, border-color 0.15s;
        font-family: inherit;
    }
    .btn:hover, .btn:focus-visible { 
        background: var(--hover-bg); color: var(--text-active);
        border-color: var(--border-highlight); outline: none; 
    }
    
    .btn.primary { background: var(--border-color); color: var(--text-active); }
    .btn.primary:hover { background: var(--border-highlight); }
    
    .btn.text-only { background: transparent; border-color: transparent; }
    .btn.text-only:hover { background: var(--hover-bg); border-color: var(--b-thin); }

    /* ---------- Tela de Configurações ---------- */
    #settings-modal {
        display: none; position: fixed; inset: 0; background: rgba(10, 10, 10, 0.9);
        z-index: 300; padding: var(--safe-y) var(--safe-x); overflow-y: hidden;
        align-items: center; justify-content: center;
        backdrop-filter: blur(2px);
    }
    .settings-content {
        width: 100%; max-width: 45rem; background: var(--bg); 
        border: var(--b-thin); display: flex; flex-direction: column; max-height: 90vh;
        border-radius: 0;
    }
    
    .settings-header { padding: 1.5rem 2rem 1rem; flex-shrink: 0; border-bottom: var(--b-thin); background: var(--surface); }
    .settings-header h2 { margin: 0 0 0.5rem; font-size: 1.4rem; font-weight: 400; color: var(--text-active); }
    .settings-header p { margin: 0; font-size: 0.9rem; font-weight: 400; color: var(--text-dim); }

    .settings-body {
        padding: 2rem; overflow-y: auto; flex-grow: 1;
        display: flex; flex-direction: column; gap: 2rem;
    }

    .settings-group { background: var(--surface); border: var(--b-thin); padding: 1.2rem; }
    .settings-group-title { display: flex; align-items: center; gap: 0.6rem; font-size: 1rem; font-weight: 400; color: var(--text); margin: 0 0 1rem 0; }
    .settings-group-title svg { width: 1.2rem; height: 1.2rem; stroke-width: 1.5; color: var(--text-dim); }

    .field-label { display: block; font-size: 0.9rem; font-weight: 400; color: var(--text-dim); margin-bottom: 0.5rem; }
    
    .import-container { display: flex; gap: 0.5rem; }
    input[type="text"], input[type="url"] {
        flex-grow: 1; background: var(--bg); color: var(--text); border: var(--b-thin);
        padding: 0.8rem; font-size: 0.95rem; border-radius: 0; font-family: inherit;
        transition: border-color 0.15s, background-color 0.15s;
    }
    input[type="text"]:focus, input[type="url"]:focus { outline: none; background: var(--surface); border-color: var(--text-dim); }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 0.5rem 0; }
    .toggle-info span { display: block; font-size: 0.95rem; font-weight: 400; color: var(--text); }
    .toggle-info small { display: block; font-size: 0.85rem; color: var(--text-dim); margin-top: 0.2rem; }
    
    /* Toggle Discreto (Quadrado) */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--surface); border: var(--b-thin); transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 4px; background-color: var(--text-dim); transition: .2s; }
    input:checked + .slider { background-color: var(--border-color); }
    input:checked + .slider:before { transform: translateX(20px); background-color: var(--text-active); }

    textarea {
        width: 100%; background: var(--bg); color: var(--text); border: var(--b-thin);
        padding: 1rem; font-size: 0.9rem; border-radius: 0;
        font-family: inherit; height: 10rem; resize: vertical; line-height: 1.5;
        transition: border-color 0.15s, background-color 0.15s;
    }
    textarea:focus { outline: none; background: var(--surface); border-color: var(--text-dim); }

    #import-msg { margin-top: 0.5rem; font-size: 0.85rem; min-height: 1.2em; display: flex; align-items: center; gap: 0.5rem; }
    #import-msg.ok { color: var(--ok); }
    #import-msg.err { color: var(--danger); }
    
    .settings-actions { padding: 1.5rem 2rem; flex-shrink: 0; display: flex; gap: 1rem; justify-content: flex-end; border-top: var(--b-thin); background: var(--surface); }

    /* =========================================================================
       MEDIA QUERIES - RESPONSIVIDADE MOBILE 
       ========================================================================= */
    @media (max-width: 900px) {
        body { padding-left: 0; padding-bottom: var(--rail-h-mobile); }

        .rail { 
            top: auto; bottom: 0; left: 0; width: 100%; height: var(--rail-h-mobile); 
            flex-direction: row; padding: 0 10px; justify-content: space-around; 
            border-right: none; border-top: var(--b-thin); background: var(--bg);
        }
        
        .rail-spacer { display: none; }
        .rail-btn { width: 44px; height: 44px; border-color: transparent; }
        .rail-btn.active { border-color: var(--border-color); }

        .main-layout { display: flex; flex-direction: column-reverse; overflow: auto; gap: 15px; }
        .player-container { flex: none; height: 35vh; position: sticky; top: 0; z-index: 50; border: none; border-bottom: var(--b-thin); }
        .sidebar-panel { flex: none; min-height: 50vh; overflow: visible; }
        .panel-scroll { overflow-y: visible; padding-right: 0; }
        
        h1 { font-size: 1.3rem; }
        .view-header { margin-bottom: 0; }
        
        #settings-modal { padding: 0; }
        .settings-content { height: 100vh; max-height: 100vh; border: none; }
        .settings-header { padding: 1.5rem; }
        .settings-body { padding: 1.5rem; }
        .settings-actions { padding: 1.5rem; flex-direction: column-reverse; }
        .btn { width: 100%; text-align: center; padding: 1rem; } 
        .import-container { flex-direction: column; }
    }
</style>
</head>
<body>

<aside class="rail" aria-label="Navegação principal">
    <button id="rail-home" class="rail-btn active" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <button id="rail-settings" class="rail-btn" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
</aside>

<div class="view-header">
    <div class="view-title-wrap">
        <button id="btn-back" class="back-btn">← Voltar</button>
        <h1 id="view-title">Início</h1>
    </div>
</div>

<main class="main-layout">
    <div class="sidebar-panel">
        <div class="panel-scroll" id="panel-content"></div>
    </div>

    <div class="player-container">
        <div class="player-topbar">
            <span id="player-title"></span>
        </div>
        <div class="player-stage" id="player-stage">
            <div class="player-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                <h3>Nenhum canal selecionado</h3>
                <p>Escolha um canal na lista ao lado para iniciar a reprodução da mídia.</p>
            </div>
        </div>
    </div>
</main>

<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-content">
        <div class="settings-header">
            <h2 id="settings-title">Configurações</h2>
            <p>Gerencie a fonte de dados do seu portal de TV e preferências.</p>
        </div>
        <div class="settings-body">
            <div class="settings-group">
                <h3 class="settings-group-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Importar via Link
                </h3>
                <label class="field-label" for="input-link">URL da Lista Remota</label>
                <div class="import-container">
                    <input type="url" id="input-link" placeholder="https://exemplo.com/lista.txt">
                    <button id="btn-import" class="btn text-only">Carregar</button>
                </div>
                <div id="import-msg"></div>
            </div>

            <div class="settings-group">
                <h3 class="settings-group-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Preferências
                </h3>
                <label class="toggle-row">
                    <div class="toggle-info">
                        <span>Agrupar por Categorias</span>
                        <small>Organiza os canais em pastas na tela inicial.</small>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="chk-categories">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>

            <div class="settings-group">
                <h3 class="settings-group-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    Editor de Código Manual
                </h3>
                <label class="field-label" for="input-config">Texto bruto (RAW)</label>
                <textarea id="input-config" placeholder="Cole o conteúdo bruto aqui ou edite as linhas manualmente..."></textarea>
            </div>
        </div>

        <div class="settings-actions">
            <button id="btn-close" class="btn text-only">Cancelar</button>
            <button id="btn-save" class="btn primary">Salvar alterações</button>
        </div>
    </div>
</div>

<script>
    const panelContent = document.getElementById('panel-content');
    const viewTitle = document.getElementById('view-title');
    const btnBack = document.getElementById('btn-back');
    const settingsModal = document.getElementById('settings-modal');
    const inputConfig = document.getElementById('input-config');
    const inputLink = document.getElementById('input-link');
    const chkCategories = document.getElementById('chk-categories');
    
    const railHome = document.getElementById('rail-home');
    const railSettings = document.getElementById('rail-settings');
    const btnImport = document.getElementById('btn-import');
    const importMsg = document.getElementById('import-msg');

    const playerStage = document.getElementById('player-stage');
    const playerTitle = document.getElementById('player-title');

    let parsedData = { template: '', categories: {} };
    let currentView = 'home';
    let activeCategory = null;
    let currentHls = null;
    let currentChannelName = null;

    function updateNavState(activeBtn) {
        [railHome, railSettings].forEach(btn => btn.classList.remove('active'));
        if(activeBtn) activeBtn.classList.add('active');
    }

    function loadConfig() { return localStorage.getItem('portal_configText') || ''; }
    function loadUseCategories() {
        const val = localStorage.getItem('portal_useCategories');
        return val !== null ? val === 'true' : true;
    }

    function parseConfig(configText) {
        const categories = {};
        if (!configText || configText.trim() === '') return { template: '', categories };

        const lines = configText.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) return { template: '', categories };

        const templateLine = lines[0].split(';')[0].split('\t')[0];
        const template = templateLine.replace(/"/g, '').trim();

        for (let i = 1; i < lines.length; i++) {
            let currentLine = lines[i];
            let parts = [];

            if (currentLine.includes('\t')) parts = currentLine.split('\t');
            else if (currentLine.includes(';')) parts = currentLine.split(';');
            else if (currentLine.includes(',')) parts = currentLine.split(',');

            if (parts.length >= 3) {
                const category = parts[0].replace(/"/g, '').trim();
                const name = parts[1].replace(/"/g, '').trim();
                const id = parts[2].replace(/"/g, '').trim();

                if (category && name && id) {
                    if (!categories[category]) categories[category] = [];
                    categories[category].push({ name, id });
                }
            }
        }
        return { template, categories };
    }

    function highlightActiveChannel() {
        const cards = panelContent.querySelectorAll('.nav-card');
        cards.forEach(card => {
            const label = card.querySelector('.label');
            if(label && label.textContent.replace(' Categoria:', '').trim() === currentChannelName || label && label.textContent === currentChannelName) {
                card.classList.add('active');
                const actionText = card.querySelector('.action-text');
                if(actionText) actionText.textContent = "EM REPRODUÇÃO";
            } else {
                card.classList.remove('active');
                const actionText = card.querySelector('.action-text');
                if(actionText) actionText.textContent = "";
            }
        });
    }

    function renderHome() {
        updateNavState(railHome);
        
        const useCategories = loadUseCategories();
        parsedData = parseConfig(loadConfig());
        const categories = parsedData.categories;

        if (Object.keys(categories).length === 0) {
            currentView = 'home';
            viewTitle.textContent = 'Início';
            btnBack.style.display = 'none';
            panelContent.innerHTML = `
                <div class="empty-state">
                    <h3>Lista vazia</h3>
                    <p>Vá em configurações para importar seus canais.</p>
                    <button class="btn primary" id="btn-empty-settings" style="margin-top:10px;">Configurações</button>
                </div>`;
            const btn = document.getElementById('btn-empty-settings');
            if(btn) btn.addEventListener('click', openModal);
            return;
        }

        if (useCategories) {
            currentView = 'categories-home';
            viewTitle.textContent = 'Categorias';
            btnBack.style.display = 'none';

            let html = '';
            for (const catName in categories) {
                const count = categories[catName].length;
                html += `<button type="button" class="nav-card" onclick="openCategory('${catName.replace(/'/g, "\\'")}')">
                            <span class="label">${catName}</span>
                            <span class="badge">${count}</span>
                         </button>`;
            }
            panelContent.innerHTML = html;
        } else {
            currentView = 'all-channels';
            viewTitle.textContent = 'Canais';
            btnBack.style.display = 'none';

            let allChannels = [];
            for (const catName in categories) {
                categories[catName].forEach(item => {
                    let link = parsedData.template;
                    if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
                    else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);
                    allChannels.push({ name: item.name, link, category: catName });
                });
            }

            allChannels.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

            let html = '';
            allChannels.forEach(item => {
                const safeName = item.name.replace(/"/g, '&quot;');
                html += `<button type="button" class="nav-card" 
                            onclick="openPlayer('${item.link.replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">
                            <span class="label">${item.name}</span>
                            <span class="action-text" style="font-size:0.75rem; letter-spacing:0.05em;"></span>
                         </button>`;
            });
            panelContent.innerHTML = html;
            highlightActiveChannel();
        }
    }

    function openCategory(catName) {
        currentView = 'category-details';
        activeCategory = catName;
        viewTitle.textContent = catName;
        btnBack.style.display = 'block';

        const items = parsedData.categories[catName] || [];
        let html = '';
        items.forEach(item => {
            let link = parsedData.template;
            if (link.includes('[CANAL]')) link = link.split('[CANAL]').join(item.id);
            else if (link.includes('[ID]')) link = link.split('[ID]').join(item.id);

            const safeName = item.name.replace(/"/g, '&quot;');
            html += `<button type="button" class="nav-card" 
                        onclick="openPlayer('${link.replace(/'/g, "\\'")}', '${safeName.replace(/'/g, "\\'")}')">
                        <span class="label">${item.name}</span>
                        <span class="action-text" style="font-size:0.75rem; letter-spacing:0.05em;"></span>
                     </button>`;
        });
        panelContent.innerHTML = html;
        highlightActiveChannel();

        if(window.innerWidth <= 900) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    btnBack.addEventListener('click', () => { renderHome(); });
    railHome.addEventListener('click', () => { renderHome(); });

    function loadHlsScript(cb) {
        if (window.Hls) { cb(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js';
        s.onload = cb; s.onerror = () => cb();
        document.head.appendChild(s);
    }

    function openPlayer(url, name) {
        if (!url) return;
        
        currentChannelName = name;
        playerTitle.textContent = name;
        playerStage.innerHTML = '';
        if (currentHls) { currentHls.destroy(); currentHls = null; }

        const isHls = /\.m3u8(\?|$)/i.test(url);
        const isDirectVideo = /\.(mp4|webm|ogg|mov|mkv)(\?|$)/i.test(url);

        if (isHls) {
            const video = document.createElement('video');
            video.controls = true; video.autoplay = true; video.playsInline = true;
            playerStage.appendChild(video);
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            } else {
                loadHlsScript(() => {
                    if (window.Hls && window.Hls.isSupported()) {
                        currentHls = new window.Hls();
                        currentHls.loadSource(url);
                        currentHls.attachMedia(video);
                    } else {
                        video.src = url;
                    }
                });
            }
        } else if (isDirectVideo) {
            const video = document.createElement('video');
            video.controls = true; video.autoplay = true; video.playsInline = true; video.src = url;
            playerStage.appendChild(video);
        } else {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
            iframe.allowFullscreen = true;
            playerStage.appendChild(iframe);
        }

        highlightActiveChannel();
        if(window.innerWidth <= 900) { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        setTimeout(() => {
            const mediaEl = playerStage.querySelector('video, iframe');
            if (mediaEl) {
                if (mediaEl.tagName.toLowerCase() === 'video') {
                    mediaEl.play().catch(e => console.log('Autoplay evitado pelo navegador:', e));
                }
                const rect = mediaEl.getBoundingClientRect();
                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);
                
                const clickEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: centerX,
                    clientY: centerY
                });
                mediaEl.dispatchEvent(clickEvent);
            }
        }, 500);
    }

    function setImportMsg(text, type) {
        importMsg.className = type || '';
        importMsg.textContent = text;
    }

    btnImport.addEventListener('click', async () => {
        const url = inputLink.value.trim();
        if (!url) { setImportMsg('Insira um link válido.', 'err'); return; }
        setImportMsg('Carregando...', '');
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Erro');
            const text = await response.text();
            inputConfig.value = text;
            setImportMsg('Importação concluída!', 'ok');
        } catch (error) {
            try {
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                const responseProxy = await fetch(proxyUrl);
                if (!responseProxy.ok) throw new Error('Erro');
                const text = await responseProxy.text();
                inputConfig.value = text;
                setImportMsg('Importação concluída!', 'ok');
            } catch (errProxy) {
                setImportMsg('Falha ao obter lista do link.', 'err');
            }
        }
    });

    function openModal() {
        updateNavState(railSettings);
        inputConfig.value = loadConfig();
        chkCategories.checked = loadUseCategories();
        setImportMsg('', '');
        inputLink.value = '';
        settingsModal.style.display = 'flex'; 
    }
    
    function closeModal() {
        settingsModal.style.display = 'none';
        updateNavState(railHome);
    }
    
    railSettings.addEventListener('click', openModal);
    document.getElementById('btn-close').addEventListener('click', closeModal);

    document.getElementById('btn-save').addEventListener('click', () => {
        localStorage.setItem('portal_configText', inputConfig.value);
        localStorage.setItem('portal_useCategories', chkCategories.checked);
        settingsModal.style.display = 'none';
        renderHome();
    });

    window.onload = () => { renderHome(); };
</script>
</body>
</html>
