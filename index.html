<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1e1f26;
            --text-color: #ffffff;
            --focus-color: #00e676; 
            --modal-bg: rgba(0, 0, 0, 0.9);
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 30px; overflow-x: hidden;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        .btn {
            background-color: #333; color: white; border: 2px solid transparent;
            padding: 10px 20px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .btn:focus, .btn:hover {
            border-color: var(--focus-color); background-color: #444; outline: none; box-shadow: 0 0 10px var(--focus-color);
        }

        h2 { font-size: 1.8rem; margin-top: 40px; margin-bottom: 15px; border-left: 5px solid var(--focus-color); padding-left: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .item-card {
            background-color: var(--card-bg); color: var(--text-color); text-decoration: none;
            padding: 20px 15px; border-radius: 10px; text-align: center; font-size: 1.2rem; font-weight: bold;
            border: 4px solid transparent; transition: all 0.2s ease-in-out; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex; align-items: center; justify-content: center; min-height: 80px;
            animation: fadeIn 0.5s ease-out both;
        }
        .item-card:focus, .item-card:hover {
            border-color: var(--focus-color); background-color: #2a2b33; transform: scale(1.05);
            outline: none; box-shadow: 0 0 15px var(--focus-color); z-index: 10;
        }

        #settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-bg); z-index: 100; padding: 40px; box-sizing: border-box; overflow-y: auto;
        }
        .settings-content { max-width: 800px; margin: 0 auto; background-color: var(--card-bg); padding: 30px; border-radius: 12px; }
        
        .import-container { display: flex; gap: 10px; margin-top: 20px; }
        
        input[type="text"] {
            flex-grow: 1; background-color: #111; color: white; border: 2px solid #333;
            padding: 15px; font-size: 1.1rem; border-radius: 8px; box-sizing: border-box; font-family: monospace;
        }
        
        textarea {
            width: 100%; background-color: #111; color: white; border: 2px solid #333; margin-top: 15px;
            padding: 15px; font-size: 1.1rem; border-radius: 8px; box-sizing: border-box; font-family: monospace;
            height: 350px; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto;
        }
        input:focus, textarea:focus { border-color: var(--focus-color); outline: none; }
        
        /* Modifica a cor do placeholder para ficar sutil e elegante */
        ::placeholder { color: #666; font-family: 'Segoe UI', sans-serif; font-size: 1rem; }
        
        .settings-actions { margin-top: 30px; display: flex; gap: 15px; }
        #import-msg { margin-top: 10px; font-size: 1rem; color: var(--focus-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Portal</h1>
        <button id="btn-open-settings" class="btn" tabindex="1">⚙️</button>
    </div>

    <div id="items-container"></div>

    <div id="settings-modal">
        <div class="settings-content">
            
            <div class="import-container">
                <!-- Adicionado o placeholder descritivo na barra de link -->
                <input type="text" id="input-link" tabindex="2" placeholder="Importar configurações através de um link...">
                <button id="btn-import" class="btn" tabindex="3">Importar</button>
            </div>
            <div id="import-msg"></div>

            <!-- Adicionado o placeholder descritivo na caixa de texto -->
            <textarea id="input-config" tabindex="4" placeholder="Ou cole suas configurações aqui..."></textarea>
            
            <div class="settings-actions">
                <button id="btn-save" class="btn" tabindex="5">Salvar</button>
                <button id="btn-close" class="btn" tabindex="6">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const itemsContainer = document.getElementById('items-container');
        const settingsModal = document.getElementById('settings-modal');
        const inputConfig = document.getElementById('input-config');
        const inputLink = document.getElementById('input-link');
        const btnOpenSettings = document.getElementById('btn-open-settings');
        const btnImport = document.getElementById('btn-import');
        const importMsg = document.getElementById('import-msg');

        function loadConfig() {
            return localStorage.getItem('portal_configText') || '';
        }

        function renderItems() {
            const configText = loadConfig();
            itemsContainer.innerHTML = '';
            
            if (!configText || configText.trim() === '') return;

            const lines = configText.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return;

            const templateLine = lines[0].split(';')[0].split('\t')[0]; 
            const template = templateLine.replace(/"/g, '').trim();

            const categories = {};

            for (let i = 1; i < lines.length; i++) {
                let currentLine = lines[i];
                let parts = [];

                if (currentLine.includes('\t')) {
                    parts = currentLine.split('\t');
                } else if (currentLine.includes(';')) {
                    parts = currentLine.split(';');
                } else if (currentLine.includes(',')) {
                    parts = currentLine.split(',');
                }

                if (parts.length >= 3) {
                    const category = parts[0].replace(/"/g, '').trim();
                    const name = parts[1].replace(/"/g, '').trim();
                    const id = parts[2].replace(/"/g, '').trim();

                    if (category && name && id) {
                        if (!categories[category]) categories[category] = [];
                        categories[category].push({ name, id });
                    }
                }
            }

            let html = '';
            for (const category in categories) {
                html += `<div class="category-container"><h2>${category}</h2><div class="grid">`;
                categories[category].forEach(item => {
                    
                    let link = template;
                    if(link.includes('[CANAL]')) {
                        link = link.split('[CANAL]').join(item.id);
                    } else if (link.includes('[ID]')) {
                        link = link.split('[ID]').join(item.id);
                    }

                    html += `<a href="${link}" class="item-card">${item.name}</a>`;
                });
                html += `</div></div>`;
            }

            itemsContainer.innerHTML = html;

            setTimeout(() => {
                const firstCard = document.querySelector('.item-card');
                if (firstCard) firstCard.focus();
                else btnOpenSettings.focus();
            }, 100);
        }

        btnImport.addEventListener('click', async () => {
            const url = inputLink.value.trim();
            if (!url) {
                importMsg.style.color = '#ff5252';
                importMsg.textContent = 'Por favor, insira um link válido.';
                return;
            }

            importMsg.style.color = 'var(--focus-color)';
            importMsg.textContent = 'Aguarde...';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('CORS Bloqueado');
                const text = await response.text();
                inputConfig.value = text;
                importMsg.textContent = 'Sucesso!';
            } catch (error) {
                try {
                    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                    const responseProxy = await fetch(proxyUrl);
                    if (!responseProxy.ok) throw new Error('Proxy Falhou');
                    const text = await responseProxy.text();
                    inputConfig.value = text;
                    importMsg.textContent = 'Sucesso!';
                } catch (errProxy) {
                    importMsg.style.color = '#ff5252';
                    importMsg.textContent = 'Falha ao importar.';
                }
            }
        });

        btnOpenSettings.addEventListener('click', () => {
            inputConfig.value = loadConfig();
            importMsg.textContent = '';
            inputLink.value = '';
            settingsModal.style.display = 'block';
            inputLink.focus();
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            settingsModal.style.display = 'none';
            btnOpenSettings.focus();
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            localStorage.setItem('portal_configText', inputConfig.value);
            settingsModal.style.display = 'none';
            renderItems(); 
        });

        window.onload = () => {
            renderItems();
        };
    </script>
</body>
</html>
